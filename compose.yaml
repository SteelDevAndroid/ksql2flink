name: ksql2flink

x-flink: &flink
  image: ksql2flink-flink:1.20.3
  build: ./docker/flink
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 1
      execution.checkpointing.interval: 10s
      state.checkpoints.dir: file:///opt/flink/state/checkpoints
  volumes:
    - ./sql/flink:/opt/flink/sql:ro
    - flink-state:/opt/flink/state

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka
    ports:
      - '127.0.0.1:29092:29092'
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  ksqldb:
    image: confluentinc/cp-ksqldb-server:7.9.2
    ports:
      - '127.0.0.1:8088:8088'
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KSQL_BOOTSTRAP_SERVERS: kafka:9092
      KSQL_LISTENERS: http://0.0.0.0:8088
      KSQL_KSQL_SERVICE_ID: migration_lab_
      KSQL_KSQL_STREAMS_REPLICATION_FACTOR: 1
      KSQL_KSQL_INTERNAL_TOPIC_REPLICAS: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR: 1
      KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE: 'true'
      KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE: 'true'
      KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET: earliest
      KSQL_KSQL_STREAMS_CACHE_MAX_BYTES_BUFFERING: 0
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8088/info >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ksqldb-cli:
    image: confluentinc/cp-ksqldb-cli:7.9.2
    profiles: [tools]
    entrypoint: /bin/ksql
    command: http://ksqldb:8088
    stdin_open: true
    tty: true
    volumes:
      - ./sql/ksqldb:/sql:ro

  jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - '127.0.0.1:8081:8081'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8081/overview >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy

  sql-client:
    <<: *flink
    profiles: [tools]
    entrypoint: /opt/flink/bin/sql-client.sh
    command: embedded
    stdin_open: true
    tty: true
    depends_on:
      jobmanager:
        condition: service_healthy

volumes:
  kafka-data:
  flink-state:
