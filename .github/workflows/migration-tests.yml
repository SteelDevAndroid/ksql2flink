name: Migration comparisons

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Kafka / ksqlDB / Flink comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Compose and Python
        run: |
          docker compose config --quiet
          python -m py_compile scripts/*.py
          bash -n scripts/seed_kafka_explorer.sh
          python scripts/generate_conformite_sql.py
          python scripts/generate_lots34_sql.py
          python scripts/generate_lots56.py
          python scripts/generate_lots78.py
          git diff --exit-code -- sql docker/flink/resources/schemas docs/lots34-contracts.json docs/lots56-contracts.json docs/lots78-contracts.json
      - name: Start migration lab
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run smoke comparison
        run: python scripts/smoke.py
      - name: Compare all five Lexhistoric queries
        run: python scripts/test_lexhistoric.py
      - name: Compare all nine conformite branches
        run: python scripts/test_conformite.py
      - name: Compare lot 3 and lot 4 queries
        run: python scripts/test_lots34.py
      - name: Compare correlated badge histories
        run: python scripts/test_badges.py
      - name: Compare stateful reference enrichment
        run: python scripts/test_socleet.py
      - name: Compare updating windows and classification alarms
        run: python scripts/test_windows.py
      - name: Seed the Kafka Explorer example topics
        run: |
          docker compose cp scripts/seed_kafka_explorer.sh kafka:/tmp/seed_kafka_explorer.sh
          docker compose exec -T kafka bash /tmp/seed_kafka_explorer.sh kafka:9092
          for spec in asf.peage.voie.passagesortieva:16 esc.peage.voie.passagesortieva:8 \
                      va.peage.backoffice.socleET.ref_compteur:6 va.peage.backoffice.socleET.etancheite:48 \
                      VA_PEAGE_CLASSIFICATION_FLOWS_EXTEND:70; do
            topic=${spec%:*}; expected=${spec##*:}
            count=$(docker compose exec -T kafka kafka-get-offsets --bootstrap-server kafka:9092 --topic "$topic" \
              | awk -F: '{ total += $3 } END { print total + 0 }')
            echo "$topic: $count message(s), $expected attendu(s)"
            [ "$count" -eq "$expected" ]
          done
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-comparison-reports
          path: artifacts/
          retention-days: 7
      - name: Stop migration lab
        if: always()
        run: docker compose down -v
