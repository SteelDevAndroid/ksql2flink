name: Migration comparisons

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Kafka / ksqlDB / Flink comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Compose and Python
        run: |
          docker compose config --quiet
          python -m py_compile scripts/smoke.py scripts/test_lexhistoric.py scripts/test_conformite.py scripts/generate_conformite_sql.py
          python scripts/generate_conformite_sql.py
          git diff --exit-code -- sql/ksqldb/03-conformite.sql sql/flink/03-conformite.sql docker/flink/resources/schemas
      - name: Start migration lab
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run smoke comparison
        run: python scripts/smoke.py
      - name: Compare all five Lexhistoric queries
        run: python scripts/test_lexhistoric.py
      - name: Compare all nine conformite branches
        run: python scripts/test_conformite.py
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-comparison-reports
          path: artifacts/
          retention-days: 7
      - name: Stop migration lab
        if: always()
        run: docker compose down -v
