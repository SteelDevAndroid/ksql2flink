# Production template for one Flink SQL chain (Flink Kubernetes Operator, application mode).
# SQL ConfigMap: kubectl -n flink-prod create configmap lot2-conformite-sql --from-file=sql/flink/03-conformite.sql
# Secret lot2-conformite-kafka: KAFKA_BOOTSTRAP, KAFKA_SECURITY_PROTOCOL, KAFKA_SASL_MECHANISM, KAFKA_JAAS.
# The broker CA must be trusted by the image JVM. Lab sinks are still at-least-once.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: lot2-conformite
  namespace: flink-prod
spec:
  image: registry.local/ksql2flink/flink:1.20.3-r1
  flinkVersion: v1_20
  serviceAccount: flink
  ingress:
    template: "flink.local/{{namespace}}/{{name}}(/|$)(.*)"
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      # The Flink Web UI has no authentication: keep it behind SSO.
      nginx.ingress.kubernetes.io/auth-url: "https://oauth2.local/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.local/oauth2/start?rd=$escaped_request_uri"
  flinkConfiguration:
    web.submit.enable: "false"
    web.cancel.enable: "false"
    state.backend.type: rocksdb
    state.backend.incremental: "true"
    state.backend.rocksdb.localdir: /rocksdb
    execution.checkpointing.interval: 30s
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    state.checkpoints.dir: s3://flink-state/lot2-conformite/checkpoints
    state.savepoints.dir: s3://flink-state/lot2-conformite/savepoints
    high-availability.type: kubernetes
    high-availability.storageDir: s3://flink-state/lot2-conformite/ha
    s3.endpoint: https://minio.local
    s3.path.style.access: "true"
    pipeline.max-parallelism: "720"
    table.exec.state.ttl: 7 d
    table.exec.source.idle-timeout: 30 s
    kubernetes.operator.periodic.savepoint.interval: 6h
    kubernetes.operator.savepoint.history.max.count: "5"
    restart-strategy.type: exponential-delay
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    taskmanager.numberOfTaskSlots: "2"
  jobManager:
    replicas: 1
    resource:
      memory: 2048m
      cpu: 1
  taskManager:
    resource:
      memory: 4096m
      cpu: 2
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: ENABLE_BUILT_IN_PLUGINS
              value: flink-s3-fs-hadoop-1.20.3.jar
          envFrom:
            - secretRef:
                name: lot2-conformite-kafka
            - secretRef:
                name: flink-s3
          volumeMounts:
            - name: rocksdb
              mountPath: /rocksdb
            - name: sql
              mountPath: /opt/flink/sql
              readOnly: true
      volumes:
        - name: rocksdb
          emptyDir: {}
        - name: sql
          configMap:
            name: lot2-conformite-sql
  job:
    jarURI: local:///opt/flink/lib/migration-lab.jar
    entryClass: lab.SqlRunner
    args:
      - /opt/flink/sql/03-conformite.sql
    parallelism: 6
    upgradeMode: savepoint
    state: running
